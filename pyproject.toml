[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "adapters", "agent_client", "dispute_rules", "actions", "audit_logger", "config", "models", "api"]

[project]
name = "dispute-resolution-poc"
version = "0.1.0"
description = "Automated Dispute Resolution POC — exact_duplicate auto-resolution only"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "streamlit>=1.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
